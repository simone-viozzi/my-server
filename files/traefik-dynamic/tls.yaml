tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      alpnProtocols:
        - h2
        - http/1.1
        # Required for the TLS-ALPN-01 ACME challenge. Overriding alpnProtocols
        # replaces Traefik's default list, which includes acme-tls/1 — without
        # it Let's Encrypt's validator is refused with "no application protocol"
        # and no certificate can ever be renewed.
        - acme-tls/1
